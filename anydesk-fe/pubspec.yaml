name: anydesk_fe
description: AzkaSave Frontend Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Supabase client
  supabase_flutter: ^2.5.0
  # HTTP Client
  dio: ^5.4.3
  # State Management (contoh pakai Riverpod)
  flutter_riverpod: ^2.5.1
  # Download Manager
  flutter_downloader: ^1.11.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  youtube_explode_dart: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/icons/app_logo.png
    - assets/icons/splash_logo.png
    - assets/icons/tiktok.png
    - assets/icons/instagram.png
    - assets/icons/facebook.png
    - assets/icons/x.png
    - assets/icons/pinterest.png
    - assets/app_logo.png
